<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invoice Generator</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <img src="/static/logo.svg" alt="Invoice Generator logo">
          <div>
            <h1>Invoice Generator</h1>
            <p>Next invoice: <strong id="nextInvoice">Loading...</strong></p>
          </div>
        </div>
        <a class="ghost-button" id="lastDownload" href="#" hidden>Download latest PDF</a>
      </header>

      <form id="invoiceForm" class="workspace">
        <section class="panel">
          <div class="section-title">
            <h2>Client</h2>
          </div>
          <label>
            Business name
            <input name="business_name" autocomplete="organization" required>
          </label>
          <div class="address-grid">
            <label>
              Street address 1
              <input name="street_1" autocomplete="address-line1" required>
            </label>
            <label>
              Street address 2
              <input name="street_2" autocomplete="address-line2" placeholder="Optional">
            </label>
            <label>
              City
              <input name="city" autocomplete="address-level2" required>
            </label>
            <label>
              State
              <select name="state" autocomplete="address-level1" required>
                <option value="">Select</option>
                <option value="AL">AL</option>
                <option value="AK">AK</option>
                <option value="AZ">AZ</option>
                <option value="AR">AR</option>
                <option value="CA">CA</option>
                <option value="CO">CO</option>
                <option value="CT">CT</option>
                <option value="DE">DE</option>
                <option value="FL">FL</option>
                <option value="GA">GA</option>
                <option value="HI">HI</option>
                <option value="ID">ID</option>
                <option value="IL">IL</option>
                <option value="IN">IN</option>
                <option value="IA">IA</option>
                <option value="KS">KS</option>
                <option value="KY">KY</option>
                <option value="LA">LA</option>
                <option value="ME">ME</option>
                <option value="MD">MD</option>
                <option value="MA">MA</option>
                <option value="MI">MI</option>
                <option value="MN">MN</option>
                <option value="MS">MS</option>
                <option value="MO">MO</option>
                <option value="MT">MT</option>
                <option value="NE">NE</option>
                <option value="NV">NV</option>
                <option value="NH">NH</option>
                <option value="NJ">NJ</option>
                <option value="NM">NM</option>
                <option value="NY">NY</option>
                <option value="NC">NC</option>
                <option value="ND">ND</option>
                <option value="OH">OH</option>
                <option value="OK">OK</option>
                <option value="OR">OR</option>
                <option value="PA">PA</option>
                <option value="RI">RI</option>
                <option value="SC">SC</option>
                <option value="SD">SD</option>
                <option value="TN">TN</option>
                <option value="TX">TX</option>
                <option value="UT">UT</option>
                <option value="VT">VT</option>
                <option value="VA">VA</option>
                <option value="WA">WA</option>
                <option value="WV">WV</option>
                <option value="WI">WI</option>
                <option value="WY">WY</option>
                <option value="DC">DC</option>
                <option value="PR">PR</option>
              </select>
            </label>
            <label>
              ZIP
              <input name="zip" autocomplete="postal-code" inputmode="numeric" required>
            </label>
          </div>
        </section>

        <section class="panel">
          <div class="section-title">
            <h2>Merchant</h2>
          </div>
          <label>
            MID number
            <input name="mid_number" required>
          </label>
          <label>
            Merchant name
            <input name="merchant_name" required>
          </label>
          <label>
            Description
            <input name="description" required>
          </label>
        </section>

        <section class="line-items">
          <div class="section-title">
            <h2>Items</h2>
          </div>
          <label class="checkbox-line">
            <input type="checkbox" id="applicableFees">
            Applicable Fees
          </label>
          <div class="item-header">
            <span>Qty</span>
            <span>Description</span>
            <span>Unit price</span>
            <span>Total</span>
            <span></span>
          </div>
          <div id="items"></div>
          <div class="add-item-row">
            <button type="button" id="addItem" class="icon-button" title="Add item">+</button>
          </div>
          <div class="total-row">
            <span>Total</span>
            <strong id="grandTotal">$0.00</strong>
          </div>
        </section>

        <section class="history panel">
          <div class="section-title">
            <h2>Recent invoices</h2>
          </div>
          <div id="historyList" class="history-list"></div>
        </section>

        <div class="actions">
          <p id="status" role="status"></p>
          <div class="action-buttons">
            <button type="button" id="cancelEdit" class="ghost-button" hidden>Cancel Edit</button>
            <button type="submit" id="submitButton" class="primary-button">Generate PDF</button>
          </div>
        </div>
      </form>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
